name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and gate toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q pmemstat tests
      - name: Tests
        run: python -m pytest -q --cov=pmemstat --cov-report=term-missing

  lint:
    name: pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and pylint
        run: |
          python -m pip install --upgrade pip
          # Pin pylint so a new release cannot unexpectedly break the required gate.
          python -m pip install . pylint==3.3.4
      - name: Lint
        run: python -m pylint pmemstat

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Inspect distributions
        run: python tests/inspect_dist.py dist/*.whl dist/*.tar.gz
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
