name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: pylint (advisory)
    runs-on: ubuntu-latest
    # Advisory for now: the codebase predates strict linting, so lint findings
    # should not block otherwise-valid contributions.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and pylint
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pylint
      - name: Lint
        run: python -m pylint pmemstat

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
